# SPDX-License-Identifier: AGPL-3.0-or-later
# DroneHighlighter: tests on Windows + DroneHighlighter.exe as a downloadable artifact.
# Runs on every push to the drone branch that touches the program, on tags like
# drone-v0.5.2, or from the Actions tab ("Run workflow", once the file is on the default branch).
name: Build DroneHighlighter.exe

on:
  workflow_dispatch:
    inputs:
      with_clip:
        description: 'Bundle PyTorch + CLIP inside the .exe (huge; normally Instalar_IA_Paisagens.bat installs it later)'
        type: boolean
        default: false
  push:
    tags: ['drone-v*']
    # Also on every update of the drone branch that touches the program.
    branches: ['drone']
    paths:
      - 'drone/**'
      - 'packaging/drone/**'
      - 'tests/test_drone_*.py'
      - 'tests/drone_fixtures.py'
      - '.github/workflows/build-drone-exe.yaml'

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg for the tests
        run: choco install ffmpeg -y --no-progress
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python PySide6 pyyaml pillow imageio-ffmpeg av pyinstaller pytest
      - name: CLIP dependencies
        if: ${{ inputs.with_clip }}
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cu128
          pip install transformers
      - name: Tests (DroneHighlighter)
        env:
          QT_QPA_PLATFORM: offscreen
          DRONEHIGHLIGHTER_NO_VIDEO_PREVIEW: '1'
        run: python -m pytest tests/test_drone_pipeline.py tests/test_drone_ai_feedback.py tests/test_drone_styles.py tests/test_drone_material_groups.py tests/test_drone_manual_edit.py -q
      - name: Build
        env:
          DH_WITH_CLIP: ${{ inputs.with_clip && '1' || '' }}
        run: pyinstaller packaging/drone/DroneHighlighter.spec --noconfirm --distpath dist --workpath build/drone
      - name: Smoke test the .exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:DRONEHIGHLIGHTER_SELFTEST = "$env:RUNNER_TEMP\selftest.txt"
          Start-Process -Wait -FilePath "dist\DroneHighlighter\DroneHighlighter.exe"
          Get-Content $env:DRONEHIGHLIGHTER_SELFTEST
          Remove-Item Env:DRONEHIGHLIGHTER_SELFTEST
          & dist\DroneHighlighter\DroneHighlighter-cli.exe --help | Select-Object -First 3
          foreach ($f in 'LEIA-ME.txt', 'Instalar_IA_Paisagens.bat', '_internal\dh_python.txt') {
            if (-not (Test-Path "dist\DroneHighlighter\$f")) { throw "missing $f" } }
      # The download is named after the version (DroneHighlighter-0.5.5-win64.zip),
      # so several versions can sit side by side on the user's PC. The folder is
      # uploaded as it is: GitHub zips it once, and "Extrair tudo" gives a folder
      # with the same versioned name.
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path drone\__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "DroneHighlighter $v"
      - uses: actions/upload-artifact@v4
        with:
          name: DroneHighlighter-${{ steps.ver.outputs.version }}-win64
          path: dist/DroneHighlighter/
          retention-days: 30
      # The artifact above stays "lite". Now prove the CLIP installer works:
      # in a copy of the folder, run the .bat (CPU torch) and check that the
      # frozen program really classifies landscapes with CLIP.
      - name: CLIP installer test (Instalar_IA_Paisagens.bat)
        if: ${{ !inputs.with_clip }}
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          $t = "$env:RUNNER_TEMP\cliptest"
          Copy-Item -Recurse dist\DroneHighlighter $t
          & "$t\Instalar_IA_Paisagens.bat" /silencioso /cpu
          if ($LASTEXITCODE -ne 0) { throw "installer failed ($LASTEXITCODE)" }
          Get-Content "$t\packs\clip\pack.json"
          if (Test-Path "$t\packs\.instalador") { throw "installer left its temp folder" }
          python -c "import sys; sys.path.insert(0, 'tests'); import drone_fixtures as f; f.make_trip(sys.argv[1])" "$env:RUNNER_TEMP\trip"
          $log = & "$t\DroneHighlighter-cli.exe" --pasta "$env:RUNNER_TEMP\trip" --so-analisar --saida "$env:RUNNER_TEMP\trip_out" 2>&1 | Out-String
          $log -split "`r?`n" | Select-String -Pattern 'CLIP|paisagem|Traceback|Error'
          if ($log -notmatch 'paisagem: clip') { $log; throw "CLIP was not used after the installer" }

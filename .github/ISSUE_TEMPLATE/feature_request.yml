name: Ideia / sugestão
description: Algo que deixaria o CataVoo melhor
title: "[ideia] "
labels:
  - enhancement
body:
  - type: textarea
    id: idea
    attributes:
      label: Sua ideia
      description: O que você gostaria de fazer e por quê (um vídeo ou imagem de exemplo ajuda muito)
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Como você faz isso hoje
      description: Opcional — em outro programa, à mão, ou ainda não dá

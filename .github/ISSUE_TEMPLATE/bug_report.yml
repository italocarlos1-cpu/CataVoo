name: Problema / erro
description: Algo não funcionou no DroneHighlighter
title: "[erro] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por testar! Quanto mais detalhes, mais rápido dá para corrigir.
        O registro de erros fica em `%LOCALAPPDATA%\DroneHighlighter\erros.log` (cole o final dele abaixo, se existir).
  - type: input
    id: version
    attributes:
      label: Versão
      description: Aparece no alto da janela principal (ex.: v0.6.6)
      placeholder: "0.6.6"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: O que você fez, o que esperava e o que aconteceu de fato
      placeholder: |
        1. Abri a prévia no formato 9:16
        2. Cliquei em RENDERIZAR
        3. O programa fechou
    validations:
      required: true
  - type: textarea
    id: pc
    attributes:
      label: Computador e vídeos
      description: Processador, placa de vídeo, Windows; modelo do drone e formato dos vídeos (4K, 10 bits, D-Log…)
      placeholder: "i5-10600K, RTX 4060, Windows 11 · DJI Mini 4 Pro, 4K 30 fps"
  - type: textarea
    id: log
    attributes:
      label: Registro (erros.log ou a caixa REGISTRO)
      render: text
